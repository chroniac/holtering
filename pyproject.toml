[project]
name = "holtering-workspace"
version = "0.0.0"
description = "Рабочее пространство holtering: парсер SCP-ECG LabTech и проверка холтеровской разметки"
requires-python = ">=3.14"
dependencies = [
  "scp-holter",
  "holtering",
]

[dependency-groups]
dev = [
  "ruff>=0.14",
  "ty>=0.0.1a20",
  "pytest>=8.4",
  "pytest-cov>=6",
  "import-linter>=2.3",
  "httpx>=0.28",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
scp-holter = { workspace = true }
holtering = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["scp_holter", "holtering"]

[tool.ty.environment]
root = ["packages/scp-holter", "packages/holtering", "."]

[tool.importlinter]
root_packages = ["scp_holter", "holtering"]

[[tool.importlinter.contracts]]
name = "парсер не знает о приложении"
type = "forbidden"
source_modules = ["scp_holter"]
forbidden_modules = ["holtering"]

[[tool.importlinter.contracts]]
name = "слои приложения: cli → api → анализ"
type = "layers"
layers = [
  "holtering.cli",
  "holtering.api",
  "holtering.analysis",
]
