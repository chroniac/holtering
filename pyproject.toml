[project]
name = "holtering"
version = "0.1.0"
description = "Holter QC viewer: flags what the device got wrong before the cardiologist reads it"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
]
