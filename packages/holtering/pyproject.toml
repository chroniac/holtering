[project]
name = "holtering"
version = "0.4.0"
description = "Holter annotation QC: flags what the recorder got wrong before the cardiologist reads the record"
requires-python = ">=3.14"
dependencies = [
  "scp-holter",
  "numpy>=2.0",
  "litestar[standard]>=2.19,<3",
  "dishka>=1.7,<2",
  "msgspec>=0.19",
  "pydantic-settings>=2.10,<3",
  "structlog>=25.4",
]

[project.scripts]
holtering = "holtering.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "holtering"
module-root = ""
